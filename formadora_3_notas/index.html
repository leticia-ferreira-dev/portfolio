<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotações</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <main>

        <h1>Minhas Anotações</h1>
        
        <div class="bloco-entrada">
            
            <!-- Campo onde o usuário digita a nota -->
            <input type="text" id="campo-nota" placeholder="Digite sua anotação aqui...">
            
            <!-- Botão que chama a função de adicionar -->
            <button id="btn-adicionar" onclick="adicionarNota()">Adicionar</button>

        </div>

        <!-- Aqui é onde as notas vão aparecer-->
        <div id="lista-anotacoes">

            <!-- As notas entram aqui via JavaScript -->

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
